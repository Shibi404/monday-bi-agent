services:
  - type: web
    name: monday-bi-agent-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MONDAY_API_TOKEN
        sync: false
      - key: MONDAY_BOARD_DEALS
        sync: false
      - key: MONDAY_BOARD_WORK_ORDERS
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: CORS_ORIGINS
        sync: false
